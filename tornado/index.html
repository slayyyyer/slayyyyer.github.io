<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tornado Alley</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-shadow: 0 0 3px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="info">Drag to rotate | Scroll to zoom</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup with ominous green-tinted tornado alley sky
        const scene = new THREE.Scene();

        // Create gradient sky background
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 512);
        gradient.addColorStop(0, '#1a1a1a');      // Dark top
        gradient.addColorStop(0.3, '#2d3a2d');    // Dark greenish
        gradient.addColorStop(0.5, '#3d4a3d');    // Green tint (tornado sky)
        gradient.addColorStop(0.7, '#4a5a4a');    // Lighter green
        gradient.addColorStop(1, '#5a6a55');      // Horizon
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 512, 512);

        const skyTexture = new THREE.CanvasTexture(canvas);
        scene.background = skyTexture;
        scene.fog = new THREE.FogExp2(0x3a4a3a, 0.004);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 15, 120);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Dramatic storm lighting
        const ambientLight = new THREE.AmbientLight(0x4a5a4a, 0.4);
        scene.add(ambientLight);

        const stormLight = new THREE.DirectionalLight(0x6a7a6a, 0.6);
        stormLight.position.set(-50, 100, 50);
        scene.add(stormLight);

        // Lightning flash light
        const lightningLight = new THREE.PointLight(0xaabbff, 0, 500);
        lightningLight.position.set(0, 150, 0);
        scene.add(lightningLight);

        // Ground - grass field with procedural texture
        const groundCanvas = document.createElement('canvas');
        groundCanvas.width = 1024;
        groundCanvas.height = 1024;
        const groundCtx = groundCanvas.getContext('2d');

        // Base grass color
        groundCtx.fillStyle = '#3a5a30';
        groundCtx.fillRect(0, 0, 1024, 1024);

        // Add grass texture variation
        for (let i = 0; i < 50000; i++) {
            const x = Math.random() * 1024;
            const y = Math.random() * 1024;
            const brightness = Math.random() * 40 - 20;
            const r = 58 + brightness;
            const g = 90 + brightness + Math.random() * 20;
            const b = 48 + brightness;
            groundCtx.fillStyle = `rgb(${r},${g},${b})`;
            groundCtx.fillRect(x, y, 2 + Math.random() * 3, 1);
        }

        // Add some dirt patches
        for (let i = 0; i < 100; i++) {
            const x = Math.random() * 1024;
            const y = Math.random() * 1024;
            groundCtx.fillStyle = `rgba(101, 67, 33, ${Math.random() * 0.3})`;
            groundCtx.beginPath();
            groundCtx.arc(x, y, Math.random() * 30 + 10, 0, Math.PI * 2);
            groundCtx.fill();
        }

        const groundTexture = new THREE.CanvasTexture(groundCanvas);
        groundTexture.wrapS = THREE.RepeatWrapping;
        groundTexture.wrapT = THREE.RepeatWrapping;
        groundTexture.repeat.set(8, 8);

        const groundGeometry = new THREE.PlaneGeometry(1000, 1000, 200, 200);
        const groundMaterial = new THREE.MeshStandardMaterial({
            map: groundTexture,
            roughness: 0.95,
            metalness: 0.0
        });

        // Add slight terrain variation
        const groundPositions = groundGeometry.attributes.position.array;
        for (let i = 0; i < groundPositions.length; i += 3) {
            groundPositions[i + 2] = Math.random() * 0.5;
        }
        groundGeometry.computeVertexNormals();

        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grass blades using instanced geometry
        const grassBladeGeometry = new THREE.PlaneGeometry(0.3, 2, 1, 4);
        const grassBladeMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                windStrength: { value: 2.0 }
            },
            vertexShader: `
                uniform float time;
                uniform float windStrength;
                varying vec2 vUv;
                varying float vHeight;

                void main() {
                    vUv = uv;
                    vHeight = position.y;

                    vec3 pos = position;

                    // Wind effect - stronger at top of blade
                    float windEffect = sin(time * 3.0 + instanceMatrix[3][0] * 0.1 + instanceMatrix[3][2] * 0.1) * windStrength;
                    windEffect *= pow(uv.y, 2.0);
                    pos.x += windEffect * 0.5;
                    pos.z += windEffect * 0.3;

                    vec4 worldPos = instanceMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * viewMatrix * worldPos;
                }
            `,
            fragmentShader: `
                varying vec2 vUv;
                varying float vHeight;

                void main() {
                    vec3 baseColor = vec3(0.2, 0.35, 0.15);
                    vec3 tipColor = vec3(0.4, 0.55, 0.25);
                    vec3 color = mix(baseColor, tipColor, vUv.y);

                    // Darker towards edges
                    float edge = abs(vUv.x - 0.5) * 2.0;
                    color *= 1.0 - edge * 0.3;

                    float alpha = 1.0 - smoothstep(0.7, 1.0, vUv.y);
                    gl_FragColor = vec4(color, alpha);
                }
            `,
            side: THREE.DoubleSide,
            transparent: true
        });

        const grassCount = 50000;
        const grassMesh = new THREE.InstancedMesh(grassBladeGeometry, grassBladeMaterial, grassCount);

        const dummy = new THREE.Object3D();
        for (let i = 0; i < grassCount; i++) {
            const x = (Math.random() - 0.5) * 400;
            const z = (Math.random() - 0.5) * 400;

            // Less grass near tornado center
            const distFromCenter = Math.sqrt(x * x + z * z);
            if (distFromCenter < 30 && Math.random() > 0.3) continue;

            dummy.position.set(x, -1, z);
            dummy.rotation.y = Math.random() * Math.PI;
            dummy.scale.setScalar(0.8 + Math.random() * 0.6);
            dummy.updateMatrix();
            grassMesh.setMatrixAt(i, dummy.matrix);
        }
        scene.add(grassMesh);

        // Tornado parameters
        const tornadoParams = {
            baseRadius: 8,
            topRadius: 45,
            height: 180,
            rotationSpeed: 3.0,
            particleCount: 35000,
            debrisCount: 800
        };

        // Main tornado funnel particles
        const particleGeometry = new THREE.BufferGeometry();
        const particleCount = tornadoParams.particleCount;

        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);
        const angles = new Float32Array(particleCount);
        const speeds = new Float32Array(particleCount);
        const heightOffsets = new Float32Array(particleCount);
        const radiusOffsets = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const heightPercent = Math.random();
            const angle = Math.random() * Math.PI * 2;

            const baseR = tornadoParams.baseRadius;
            const topR = tornadoParams.topRadius;

            // More realistic funnel curve
            const currentRadius = baseR + (topR - baseR) * Math.pow(heightPercent, 0.5);
            const radiusVariation = (Math.random() - 0.5) * currentRadius * 0.5;
            const radius = currentRadius + radiusVariation;

            const y = heightPercent * tornadoParams.height;
            positions[i * 3] = Math.cos(angle) * radius;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = Math.sin(angle) * radius;

            // Color: brown dirt at bottom, gray dust higher up
            const brightness = 0.25 + heightPercent * 0.35;
            const brownAmount = 1.0 - heightPercent;
            colors[i * 3] = brightness * (0.6 + brownAmount * 0.4);
            colors[i * 3 + 1] = brightness * (0.5 + brownAmount * 0.2);
            colors[i * 3 + 2] = brightness * (0.4 + brownAmount * 0.1);

            sizes[i] = (Math.random() * 2.5 + 0.8) * (1 + heightPercent * 0.5);
            angles[i] = angle;
            speeds[i] = 0.7 + Math.random() * 0.6;
            heightOffsets[i] = heightPercent;
            radiusOffsets[i] = radiusVariation;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        particleGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 }
            },
            vertexShader: `
                attribute float size;
                attribute vec3 color;
                varying vec3 vColor;
                varying float vAlpha;

                void main() {
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (250.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                    vAlpha = 1.0 - smoothstep(0.0, 200.0, -mvPosition.z);
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                varying float vAlpha;

                void main() {
                    float r = distance(gl_PointCoord, vec2(0.5));
                    if (r > 0.5) discard;
                    float alpha = 0.7 * (1.0 - smoothstep(0.15, 0.5, r)) * vAlpha;
                    gl_FragColor = vec4(vColor, alpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.NormalBlending
        });

        const tornadoParticles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(tornadoParticles);

        // Debris - grass, wheat, dirt chunks
        const debrisGeometry = new THREE.BufferGeometry();
        const debrisCount = tornadoParams.debrisCount;
        const debrisPositions = new Float32Array(debrisCount * 3);
        const debrisColors = new Float32Array(debrisCount * 3);
        const debrisSizes = new Float32Array(debrisCount);
        const debrisData = [];

        for (let i = 0; i < debrisCount; i++) {
            const heightPercent = Math.random() * 0.7;
            const angle = Math.random() * Math.PI * 2;
            const radius = tornadoParams.baseRadius + (tornadoParams.topRadius - tornadoParams.baseRadius) * heightPercent;

            debrisData.push({
                angle: angle,
                height: heightPercent,
                radius: radius * (0.7 + Math.random() * 0.6),
                speed: 0.4 + Math.random() * 0.6,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.02 + Math.random() * 0.05,
                type: Math.random() // 0-0.5 = grass, 0.5-0.8 = wheat, 0.8-1 = dirt
            });

            // Color based on debris type
            const type = debrisData[i].type;
            if (type < 0.5) {
                // Green grass
                debrisColors[i * 3] = 0.2 + Math.random() * 0.1;
                debrisColors[i * 3 + 1] = 0.4 + Math.random() * 0.2;
                debrisColors[i * 3 + 2] = 0.1 + Math.random() * 0.1;
            } else if (type < 0.8) {
                // Golden wheat
                debrisColors[i * 3] = 0.6 + Math.random() * 0.2;
                debrisColors[i * 3 + 1] = 0.5 + Math.random() * 0.1;
                debrisColors[i * 3 + 2] = 0.2;
            } else {
                // Brown dirt
                debrisColors[i * 3] = 0.4 + Math.random() * 0.1;
                debrisColors[i * 3 + 1] = 0.25 + Math.random() * 0.1;
                debrisColors[i * 3 + 2] = 0.15;
            }

            debrisSizes[i] = 3 + Math.random() * 6;
        }

        debrisGeometry.setAttribute('position', new THREE.BufferAttribute(debrisPositions, 3));
        debrisGeometry.setAttribute('color', new THREE.BufferAttribute(debrisColors, 3));
        debrisGeometry.setAttribute('size', new THREE.BufferAttribute(debrisSizes, 1));

        const debrisMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                attribute float size;
                attribute vec3 color;
                varying vec3 vColor;
                void main() {
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (180.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                void main() {
                    vec2 center = gl_PointCoord - 0.5;
                    float dist = length(center);
                    if (dist > 0.4) discard;
                    gl_FragColor = vec4(vColor, 0.95);
                }
            `,
            transparent: true
        });

        const debrisParticles = new THREE.Points(debrisGeometry, debrisMaterial);
        scene.add(debrisParticles);

        // Ground dust/dirt cloud at tornado base
        const dustGeometry = new THREE.BufferGeometry();
        const dustCount = 5000;
        const dustPositions = new Float32Array(dustCount * 3);
        const dustSizes = new Float32Array(dustCount);
        const dustData = [];

        for (let i = 0; i < dustCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 60 + 8;

            dustData.push({
                angle: angle,
                radius: radius,
                speed: 0.2 + Math.random() * 0.4,
                height: Math.random() * 15,
                vertSpeed: Math.random() * 0.5
            });

            dustSizes[i] = 4 + Math.random() * 8;
        }

        dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        dustGeometry.setAttribute('size', new THREE.BufferAttribute(dustSizes, 1));

        const dustMaterial = new THREE.ShaderMaterial({
            uniforms: {
                color: { value: new THREE.Color(0x6b5344) }
            },
            vertexShader: `
                attribute float size;
                varying float vDist;
                varying float vHeight;
                void main() {
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (250.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                    vDist = length(position.xz);
                    vHeight = position.y;
                }
            `,
            fragmentShader: `
                uniform vec3 color;
                varying float vDist;
                varying float vHeight;
                void main() {
                    float r = distance(gl_PointCoord, vec2(0.5));
                    if (r > 0.5) discard;
                    float distFade = 1.0 - smoothstep(30.0, 70.0, vDist);
                    float heightFade = 1.0 - smoothstep(5.0, 15.0, vHeight);
                    float alpha = 0.5 * (1.0 - r * 1.5) * distFade * (0.5 + heightFade * 0.5);
                    gl_FragColor = vec4(color, alpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.NormalBlending
        });

        const dustParticles = new THREE.Points(dustGeometry, dustMaterial);
        scene.add(dustParticles);

        // Supercell cloud formation (mesocyclone)
        const cloudGeometry = new THREE.BufferGeometry();
        const cloudCount = 8000;
        const cloudPositions = new Float32Array(cloudCount * 3);
        const cloudSizes = new Float32Array(cloudCount);
        const cloudData = [];

        for (let i = 0; i < cloudCount; i++) {
            const angle = Math.random() * Math.PI * 2;

            // Rotating wall cloud structure
            let radius, height;
            const layer = Math.random();

            if (layer < 0.4) {
                // Dense rotating wall cloud
                radius = Math.random() * 50 + 30;
                height = tornadoParams.height + Math.random() * 30 - 15;
            } else if (layer < 0.7) {
                // Main cloud base
                radius = Math.random() * 150 + 50;
                height = tornadoParams.height + 20 + Math.random() * 40;
            } else {
                // Outer anvil spread
                radius = Math.random() * 300 + 100;
                height = tornadoParams.height + 50 + Math.random() * 60;
            }

            cloudPositions[i * 3] = Math.cos(angle) * radius;
            cloudPositions[i * 3 + 1] = height;
            cloudPositions[i * 3 + 2] = Math.sin(angle) * radius;

            cloudData.push({
                angle: angle,
                radius: radius,
                baseHeight: height,
                rotSpeed: 0.1 + Math.random() * 0.1
            });

            cloudSizes[i] = 15 + Math.random() * 25;
        }

        cloudGeometry.setAttribute('position', new THREE.BufferAttribute(cloudPositions, 3));
        cloudGeometry.setAttribute('size', new THREE.BufferAttribute(cloudSizes, 1));

        const cloudMaterial = new THREE.ShaderMaterial({
            uniforms: {
                baseColor: { value: new THREE.Color(0x2a3a2a) },
                lightColor: { value: new THREE.Color(0x4a5a4a) }
            },
            vertexShader: `
                attribute float size;
                varying float vHeight;
                void main() {
                    vHeight = position.y;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (400.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform vec3 baseColor;
                uniform vec3 lightColor;
                varying float vHeight;
                void main() {
                    float r = distance(gl_PointCoord, vec2(0.5));
                    if (r > 0.5) discard;
                    float heightMix = smoothstep(180.0, 280.0, vHeight);
                    vec3 color = mix(baseColor, lightColor, heightMix);
                    float alpha = 0.8 * (1.0 - smoothstep(0.2, 0.5, r));
                    gl_FragColor = vec4(color, alpha);
                }
            `,
            transparent: true,
            depthWrite: false
        });

        const cloudParticles = new THREE.Points(cloudGeometry, cloudMaterial);
        scene.add(cloudParticles);

        // Rain particles in the distance
        const rainGeometry = new THREE.BufferGeometry();
        const rainCount = 3000;
        const rainPositions = new Float32Array(rainCount * 3);
        const rainData = [];

        for (let i = 0; i < rainCount; i++) {
            const x = (Math.random() - 0.5) * 400;
            const z = (Math.random() - 0.5) * 400 - 100;
            const y = Math.random() * 200;

            rainPositions[i * 3] = x;
            rainPositions[i * 3 + 1] = y;
            rainPositions[i * 3 + 2] = z;

            rainData.push({ x, z, speed: 2 + Math.random() * 2 });
        }

        rainGeometry.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));

        const rainMaterial = new THREE.PointsMaterial({
            color: 0x8899aa,
            size: 0.5,
            transparent: true,
            opacity: 0.4
        });

        const rainParticles = new THREE.Points(rainGeometry, rainMaterial);
        scene.add(rainParticles);

        // Camera controls
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngle = 0.3;
        let cameraHeight = 15;
        let cameraDistance = 120;

        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        document.addEventListener('mouseup', () => isDragging = false);

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            cameraAngle += (e.clientX - previousMousePosition.x) * 0.008;
            cameraHeight = Math.max(3, Math.min(80, cameraHeight - (e.clientY - previousMousePosition.y) * 0.2));
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        document.addEventListener('wheel', (e) => {
            cameraDistance = Math.max(40, Math.min(250, cameraDistance + e.deltaY * 0.15));
        });

        // Touch controls
        document.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });
        document.addEventListener('touchend', () => isDragging = false);
        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            cameraAngle += (e.touches[0].clientX - previousMousePosition.x) * 0.008;
            cameraHeight = Math.max(3, Math.min(80, cameraHeight - (e.touches[0].clientY - previousMousePosition.y) * 0.2));
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        // Animation loop
        let time = 0;
        let lightningTimer = 0;
        let lightningDuration = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            // Camera
            camera.position.x = Math.sin(cameraAngle) * cameraDistance;
            camera.position.z = Math.cos(cameraAngle) * cameraDistance;
            camera.position.y = cameraHeight;
            camera.lookAt(0, 50, 0);

            // Update grass wind
            grassBladeMaterial.uniforms.time.value = time;

            // Update tornado particles
            const tPos = tornadoParticles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const heightPercent = heightOffsets[i];
                const baseR = tornadoParams.baseRadius;
                const topR = tornadoParams.topRadius;

                const rotSpeed = tornadoParams.rotationSpeed * (0.4 + heightPercent * 0.9) * speeds[i];
                angles[i] += rotSpeed * 0.016;

                const currentRadius = baseR + (topR - baseR) * Math.pow(heightPercent, 0.5);
                const turbulence = Math.sin(time * 2.5 + heightPercent * 12 + angles[i]) * 3;
                const radius = currentRadius + radiusOffsets[i] + turbulence;

                let y = heightPercent * tornadoParams.height;
                y += Math.sin(time * 1.5 + angles[i] * 2) * 3;

                tPos[i * 3] = Math.cos(angles[i]) * radius;
                tPos[i * 3 + 1] = y;
                tPos[i * 3 + 2] = Math.sin(angles[i]) * radius;
            }
            tornadoParticles.geometry.attributes.position.needsUpdate = true;

            // Update debris
            const dPos = debrisParticles.geometry.attributes.position.array;
            for (let i = 0; i < debrisCount; i++) {
                const d = debrisData[i];
                d.angle += tornadoParams.rotationSpeed * d.speed * 0.016;
                d.wobble += d.wobbleSpeed;

                const wobbleX = Math.sin(d.wobble) * 4;
                const wobbleY = Math.cos(d.wobble * 1.5) * 3;
                const wobbleZ = Math.sin(d.wobble * 0.7) * 3;

                dPos[i * 3] = Math.cos(d.angle) * d.radius + wobbleX;
                dPos[i * 3 + 1] = d.height * tornadoParams.height + wobbleY + 8;
                dPos[i * 3 + 2] = Math.sin(d.angle) * d.radius + wobbleZ;
            }
            debrisParticles.geometry.attributes.position.needsUpdate = true;

            // Update dust cloud
            const dustPos = dustParticles.geometry.attributes.position.array;
            for (let i = 0; i < dustCount; i++) {
                const d = dustData[i];
                d.angle += d.speed * 0.016;

                dustPos[i * 3] = Math.cos(d.angle) * d.radius;
                dustPos[i * 3 + 1] = d.height + Math.sin(time * 0.8 + d.angle) * 3;
                dustPos[i * 3 + 2] = Math.sin(d.angle) * d.radius;
            }
            dustParticles.geometry.attributes.position.needsUpdate = true;

            // Rotate clouds (mesocyclone effect)
            const cPos = cloudParticles.geometry.attributes.position.array;
            for (let i = 0; i < cloudCount; i++) {
                const c = cloudData[i];
                c.angle += c.rotSpeed * 0.016 * (80 / Math.max(c.radius, 30));

                cPos[i * 3] = Math.cos(c.angle) * c.radius;
                cPos[i * 3 + 1] = c.baseHeight + Math.sin(time * 0.3 + c.angle) * 5;
                cPos[i * 3 + 2] = Math.sin(c.angle) * c.radius;
            }
            cloudParticles.geometry.attributes.position.needsUpdate = true;

            // Update rain
            const rPos = rainParticles.geometry.attributes.position.array;
            for (let i = 0; i < rainCount; i++) {
                rPos[i * 3 + 1] -= rainData[i].speed;
                if (rPos[i * 3 + 1] < 0) {
                    rPos[i * 3 + 1] = 200;
                }
            }
            rainParticles.geometry.attributes.position.needsUpdate = true;

            // Lightning
            lightningTimer -= 0.016;
            if (lightningTimer <= 0) {
                if (Math.random() < 0.015) {
                    lightningLight.intensity = 3 + Math.random() * 4;
                    lightningLight.position.set(
                        (Math.random() - 0.5) * 200,
                        150 + Math.random() * 50,
                        (Math.random() - 0.5) * 200
                    );
                    lightningDuration = 0.05 + Math.random() * 0.15;
                    lightningTimer = lightningDuration;

                    // Flash the sky slightly
                    scene.fog.color.setHex(0x5a6a5a);
                }
            } else {
                lightningLight.intensity *= 0.85;
                scene.fog.color.lerp(new THREE.Color(0x3a4a3a), 0.1);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
