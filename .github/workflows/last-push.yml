name: Refresh last-push panel

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: last-push
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/last_push.py

      - name: Commit when the panel changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Panel is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh the last-push panel" \
            -m "The scheduled job read each project's pushed_at from the GitHub API and rewrote the five newest rows, so the homepage dates no longer depend on a manual check."
          git push
